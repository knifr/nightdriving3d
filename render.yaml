services:
  - type: web
    name: nightdrive-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BOT_TOKEN
        sync: false
      - key: GAME_URL
        value: https://t.me/nightdriving3d_bot?startapp=game_heart
